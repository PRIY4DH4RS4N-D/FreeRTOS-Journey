<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Clean crisp white with subtle blue tint -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>

    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <linearGradient id="cyanPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.06"/>
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>

    <filter id="chipShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#0284C7" flood-opacity="0.2"/>
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.3"/>
    </filter>

    <filter id="glowGreen" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowBlue" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Background Pattern -->
    <pattern id="dotPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#E2E8F0" />
    </pattern>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(0.98); }
        50% { opacity: 1; transform: scale(1.05); }
      }
      @keyframes traceFlow {
        0% { stroke-dashoffset: 180; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes blinkFast {
        0%, 100% { opacity: 0.2; }
        40%, 60% { opacity: 1; }
      }
      @keyframes blinkSteady {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 1; filter: drop-shadow(0 0 6px #10B981); }
      }
      @keyframes waveScroll {
        0% { transform: translateX(0); }
        100% { transform: translateX(-120px); }
      }
      @keyframes packetTravel {
        0% { offset-distance: 0%; opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { offset-distance: 100%; opacity: 0; }
      }

      .pulse-trace {
        stroke-dasharray: 12, 16;
        animation: traceFlow 3.5s linear infinite;
      }
      .pulse-trace-fast {
        stroke-dasharray: 8, 12;
        animation: traceFlow 2s linear infinite reverse;
      }
      .led-heartbeat {
        animation: blinkSteady 1.4s ease-in-out infinite;
      }
      .led-tx {
        animation: blinkFast 0.8s ease-in-out infinite;
      }
      .led-rx {
        animation: blinkFast 0.5s ease-in-out infinite 0.2s;
      }
      .chip-core-pulse {
        animation: pulseGlow 4s ease-in-out infinite;
      }
      .wave-motion {
        animation: waveScroll 2.8s linear infinite;
      }
    </style>
  </defs>

  <!-- Base Card Container -->
  <rect x="8" y="8" width="1184" height="324" rx="16" fill="url(#bgGradient)" stroke="#E2E8F0" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="8" y="8" width="1184" height="324" rx="16" fill="url(#dotPattern)" opacity="0.6"/>

  <!-- Subtle Top Decorative Navy Line -->
  <path d="M 8 24 Q 600 24 1192 24" stroke="url(#blueGrad)" stroke-width="2.5" fill="none" opacity="0.85"/>

  <!-- ==================== CIRCUIT BOARD TRACES ==================== -->
  <g opacity="0.45">
    <!-- Left PCB Traces -->
    <path d="M 20 60 L 140 60 L 180 100 L 260 100" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
    <circle cx="20" cy="60" r="3.5" fill="#64748B"/>
    <circle cx="260" cy="100" r="2.5" fill="#3B82F6"/>

    <path d="M 30 180 L 100 180 L 130 210 L 220 210" fill="none" stroke="#94A3B8" stroke-width="1.2"/>
    <circle cx="30" cy="180" r="3" fill="#64748B"/>

    <path d="M 50 280 L 160 280 L 200 240 L 320 240" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
    <circle cx="50" cy="280" r="3.5" fill="#64748B"/>

    <!-- Right PCB Traces into Chip -->
    <path d="M 800 70 L 920 70 L 960 110 L 1020 110" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
    <path d="M 760 190 L 840 190 L 870 160 L 980 160" fill="none" stroke="#94A3B8" stroke-width="1.2"/>
    <path d="M 820 270 L 900 270 L 940 230 L 1000 230" fill="none" stroke="#94A3B8" stroke-width="1.5"/>

    <!-- Dynamic Flowing Data Traces -->
    <path d="M 20 60 L 140 60 L 180 100 L 260 100" fill="none" stroke="#0284C7" stroke-width="2" class="pulse-trace"/>
    <path d="M 800 70 L 920 70 L 960 110 L 1020 110" fill="none" stroke="#2563EB" stroke-width="2" class="pulse-trace-fast"/>
    <path d="M 820 270 L 900 270 L 940 230 L 1000 230" fill="none" stroke="#0EA5E9" stroke-width="2" class="pulse-trace"/>
  </g>

  <!-- ==================== LEFT & CENTER CONTENT ==================== -->
  <g transform="translate(48, 44)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="280" height="26" rx="13" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
      <!-- Status LED inside badge -->
      <circle cx="14" cy="13" r="4.5" fill="#10B981" class="led-heartbeat"/>
      <text x="26" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1D4ED8" letter-spacing="1.1">EMBEDDED RTOS PORTFOLIO</text>
      <text x="212" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#64748B">ESP-IDF v6.1</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="800" fill="#0F172A" letter-spacing="-0.5">
      FreeRTOS Embedded Systems Journey
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="0" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#334155">
      Production-Grade Real-Time Systems Architecture on Espressif ESP32 (Xtensa Dual-Core 240 MHz)
    </text>

    <text x="0" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#64748B">
      10 Structured Milestones: Preemption • Queues • Semaphores • Mutexes • ISR Deferral • Memory Auditing
    </text>

    <!-- Mini Feature Badges Row -->
    <g transform="translate(0, 150)">
      <!-- Badge 1: Dual-Core SMP -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="128" height="32" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
        <circle cx="14" cy="16" r="4" fill="#3B82F6"/>
        <text x="25" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11.5" font-weight="700" fill="#1E293B">SMP Dual-Core</text>
      </g>

      <!-- Badge 2: Preemptive Kernel -->
      <g transform="translate(138, 0)">
        <rect x="0" y="0" width="138" height="32" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
        <circle cx="14" cy="16" r="4" fill="#10B981"/>
        <text x="25" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11.5" font-weight="700" fill="#1E293B">Tick Preemption</text>
      </g>

      <!-- Badge 3: Verified Footprints -->
      <g transform="translate(286, 0)">
        <rect x="0" y="0" width="144" height="32" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
        <circle cx="14" cy="16" r="4" fill="#8B5CF6"/>
        <text x="25" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11.5" font-weight="700" fill="#1E293B">RAM/ROM Audited</text>
      </g>

      <!-- Badge 4: Hardware Verified -->
      <g transform="translate(440, 0)">
        <rect x="0" y="0" width="146" height="32" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
        <circle cx="14" cy="16" r="4" fill="#F59E0B"/>
        <text x="25" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11.5" font-weight="700" fill="#1E293B">Hardware Proven</text>
      </g>
    </g>

    <!-- Oscilloscope / Logic Analyzer Widget -->
    <g transform="translate(0, 204)">
      <rect x="0" y="0" width="586" height="48" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
      
      <!-- Mini Grid -->
      <line x1="0" y1="24" x2="586" y2="24" stroke="#1E293B" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="100" y1="0" x2="100" y2="48" stroke="#1E293B" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="200" y1="0" x2="200" y2="48" stroke="#1E293B" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="300" y1="0" x2="300" y2="48" stroke="#1E293B" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="400" y1="0" x2="400" y2="48" stroke="#1E293B" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="500" y1="0" x2="500" y2="48" stroke="#1E293B" stroke-width="1" stroke-dasharray="4,4"/>

      <!-- Label -->
      <text x="12" y="16" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="9" font-weight="700" fill="#38BDF8">CH1: SCHED_TICK [1kHz]</text>
      <text x="12" y="38" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="9" font-weight="700" fill="#34D399">CH2: TASK_PREEMPT</text>

      <!-- Waveform 1 (Clock / Tick) -->
      <g clip-path="url(#waveClip)">
        <path d="M 130 18 L 150 18 L 150 10 L 170 10 L 170 18 L 190 18 L 190 10 L 210 10 L 210 18 L 230 18 L 230 10 L 250 10 L 250 18 L 270 18 L 270 10 L 290 10 L 290 18 L 310 18 L 310 10 L 330 10 L 330 18 L 350 18 L 350 10 L 370 10 L 370 18 L 390 18 L 390 10 L 410 10 L 410 18 L 430 18 L 430 10 L 450 10 L 450 18 L 470 18 L 470 10 L 490 10 L 490 18 L 510 18 L 510 10 L 530 10 L 530 18 L 550 18 L 550 10 L 570 10 L 570 18 L 590 18" fill="none" stroke="#38BDF8" stroke-width="1.6"/>
        <!-- Waveform 2 (Task Pulse) -->
        <path d="M 130 40 L 180 40 L 180 28 L 220 28 L 220 40 L 290 40 L 290 28 L 370 28 L 370 40 L 440 40 L 440 28 L 490 28 L 490 40 L 560 40 L 560 28 L 580 28" fill="none" stroke="#34D399" stroke-width="1.8"/>
      </g>
    </g>
  </g>

  <!-- ==================== RIGHT SIDE: PHYSICAL CHIP GRAPHIC ==================== -->
  <g transform="translate(860, 40)">
    <!-- Outer IC Outline Pins -->
    <!-- Top Pins -->
    <g stroke="#94A3B8" stroke-width="3">
      <line x1="50" y1="12" x2="50" y2="28"/>
      <line x1="80" y1="12" x2="80" y2="28"/>
      <line x1="110" y1="12" x2="110" y2="28"/>
      <line x1="140" y1="12" x2="140" y2="28"/>
      <line x1="170" y1="12" x2="170" y2="28"/>
      <line x1="200" y1="12" x2="200" y2="28"/>
      <line x1="230" y1="12" x2="230" y2="28"/>
    </g>

    <!-- Bottom Pins -->
    <g stroke="#94A3B8" stroke-width="3">
      <line x1="50" y1="238" x2="50" y2="254"/>
      <line x1="80" y1="238" x2="80" y2="254"/>
      <line x1="110" y1="238" x2="110" y2="254"/>
      <line x1="140" y1="238" x2="140" y2="254"/>
      <line x1="170" y1="238" x2="170" y2="254"/>
      <line x1="200" y1="238" x2="200" y2="254"/>
      <line x1="230" y1="238" x2="230" y2="254"/>
    </g>

    <!-- Left Pins -->
    <g stroke="#94A3B8" stroke-width="3">
      <line x1="12" y1="60" x2="28" y2="60"/>
      <line x1="12" y1="90" x2="28" y2="90"/>
      <line x1="12" y1="120" x2="28" y2="120"/>
      <line x1="12" y1="150" x2="28" y2="150"/>
      <line x1="12" y1="180" x2="28" y2="180"/>
      <line x1="12" y1="210" x2="28" y2="210"/>
    </g>

    <!-- Right Pins -->
    <g stroke="#94A3B8" stroke-width="3">
      <line x1="252" y1="60" x2="268" y2="60"/>
      <line x1="252" y1="90" x2="268" y2="90"/>
      <line x1="252" y1="120" x2="268" y2="120"/>
      <line x1="252" y1="150" x2="268" y2="150"/>
      <line x1="252" y1="180" x2="268" y2="180"/>
      <line x1="252" y1="210" x2="268" y2="210"/>
    </g>

    <!-- Chip Body -->
    <rect x="28" y="28" width="224" height="210" rx="12" fill="url(#chipGrad)" stroke="#334155" stroke-width="2" filter="url(#chipShadow)"/>

    <!-- Chip Notch / Orientation Marker -->
    <circle cx="48" cy="48" r="6" fill="#334155"/>

    <!-- Dual Core Inner Block (Silicon Core Visualization) -->
    <rect x="46" y="70" width="88" height="64" rx="6" fill="#0B1329" stroke="#1D4ED8" stroke-width="1.5"/>
    <text x="56" y="90" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#60A5FA">CORE 0</text>
    <text x="56" y="104" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#94A3B8">PRO CPU</text>
    <text x="56" y="122" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#34D399">240 MHz</text>

    <rect x="146" y="70" width="88" height="64" rx="6" fill="#0B1329" stroke="#1D4ED8" stroke-width="1.5"/>
    <text x="156" y="90" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#60A5FA">CORE 1</text>
    <text x="156" y="104" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#94A3B8">APP CPU</text>
    <text x="156" y="122" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#34D399">240 MHz</text>

    <!-- FreeRTOS SMP Kernel Banner across cores -->
    <rect x="46" y="144" width="188" height="34" rx="6" fill="#1E293B" stroke="#0284C7" stroke-width="1.2"/>
    <circle cx="58" cy="161" r="4" fill="#38BDF8" class="chip-core-pulse"/>
    <text x="68" y="165" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#F8FAFC">FreeRTOS SMP KERNEL</text>

    <!-- Chip Sub-Info -->
    <text x="140" y="200" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#64748B" letter-spacing="1">ESP32-WROOM-32</text>
    <text x="140" y="218" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#475569">520KB SRAM • 4MB FLASH</text>

    <!-- Status LEDs Top Right of Chip -->
    <g transform="translate(182, 38)">
      <circle cx="0" cy="0" r="4" fill="#10B981" class="led-heartbeat" filter="url(#glowGreen)"/>
      <circle cx="16" cy="0" r="3.5" fill="#F59E0B" class="led-tx"/>
      <circle cx="30" cy="0" r="3.5" fill="#3B82F6" class="led-rx" filter="url(#glowBlue)"/>
    </g>
  </g>
</svg>
