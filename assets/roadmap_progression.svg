<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="roadBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>

    <!-- Phase Gradients -->
    <linearGradient id="p1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <linearGradient id="p2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>

    <linearGradient id="p3Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <linearGradient id="p4Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <filter id="roadShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.05"/>
    </filter>

    <style>
      @keyframes flowDot {
        0% { stroke-dashoffset: 40; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulsePill {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.03); }
      }
      .anim-bus {
        stroke-dasharray: 6, 6;
        animation: flowDot 2s linear infinite;
      }
    </style>
  </defs>

  <rect x="6" y="6" width="1108" height="268" rx="14" fill="url(#roadBg)" stroke="#E2E8F0" stroke-width="1.5" filter="url(#roadShadow)"/>

  <!-- Bus Connectors -->
  <line x1="280" y1="140" x2="310" y2="140" stroke="#94A3B8" stroke-width="2.5"/>
  <line x1="550" y1="140" x2="580" y2="140" stroke="#94A3B8" stroke-width="2.5"/>
  <line x1="820" y1="140" x2="850" y2="140" stroke="#94A3B8" stroke-width="2.5"/>

  <!-- Animated flow lines -->
  <line x1="280" y1="140" x2="310" y2="140" stroke="#2563EB" stroke-width="3" class="anim-bus"/>
  <line x1="550" y1="140" x2="580" y2="140" stroke="#0284C7" stroke-width="3" class="anim-bus"/>
  <line x1="820" y1="140" x2="850" y2="140" stroke="#7C3AED" stroke-width="3" class="anim-bus"/>

  <!-- Phase 1 Card -->
  <g transform="translate(30, 28)">
    <rect x="0" y="0" width="250" height="224" rx="10" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="1.5" filter="url(#roadShadow)"/>
    <rect x="0" y="0" width="250" height="34" rx="10" fill="url(#p1Grad)"/>
    <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#FFFFFF">PHASE 1: FOUNDATIONS</text>
    <rect x="180" y="7" width="58" height="20" rx="4" fill="#1E3A8A"/>
    <text x="186" y="21" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#BFDBFE">BEGINNER</text>

    <!-- Project List -->
    <g transform="translate(14, 46)">
      <circle cx="8" cy="14" r="3" fill="#2563EB"/>
      <text x="18" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#0F172A">01. FreeRTOS LED Blink</text>
      <text x="18" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#64748B">Task creation &amp; non-blocking delay</text>

      <circle cx="8" cy="62" r="3" fill="#2563EB"/>
      <text x="18" y="66" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#0F172A">02. Native Multi-Tasks</text>
      <text x="18" y="80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#64748B">ESP-IDF drivers &amp; concurrent loops</text>

      <circle cx="8" cy="110" r="3" fill="#2563EB"/>
      <text x="18" y="114" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#0F172A">03. Task Priorities</text>
      <text x="18" y="128" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#64748B">Deterministic priority preemption</text>

      <rect x="0" y="148" width="222" height="22" rx="4" fill="#EFF6FF"/>
      <text x="8" y="163" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#1D4ED8">Core: xTaskCreate, vTaskDelay</text>
    </g>
  </g>

  <!-- Phase 2 Card -->
  <g transform="translate(305, 28)">
    <rect x="0" y="0" width="245" height="224" rx="10" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1.5" filter="url(#roadShadow)"/>
    <rect x="0" y="0" width="245" height="34" rx="10" fill="url(#p2Grad)"/>
    <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#FFFFFF">PHASE 2: IPC &amp; SYNC</text>
    <rect x="156" y="7" width="76" height="20" rx="4" fill="#0369A1"/>
    <text x="162" y="21" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#E0F2FE">INTERMEDIATE</text>

    <!-- Project List -->
    <g transform="translate(14, 46)">
      <circle cx="8" cy="14" r="3" fill="#0284C7"/>
      <text x="18" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#0F172A">04. Queue IPC Pipeline</text>
      <text x="18" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#64748B">Thread-safe FIFO buffering &amp; structs</text>

      <circle cx="8" cy="62" r="3" fill="#0284C7"/>
      <text x="18" y="66" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#0F172A">05. Semaphores</text>
      <text x="18" y="80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#64748B">Binary events &amp; counting burst pools</text>

      <circle cx="8" cy="110" r="3" fill="#0284C7"/>
      <text x="18" y="114" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#0F172A">06. Mutex Resource Lock</text>
      <text x="18" y="128" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#64748B">Guards bus; priority inheritance</text>

      <rect x="0" y="148" width="217" height="22" rx="4" fill="#F0F9FF"/>
      <text x="8" y="163" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#0284C7">Core: xQueue, xSemaphore</text>
    </g>
  </g>

  <!-- Phase 3 Card -->
  <g transform="translate(575, 28)">
    <rect x="0" y="0" width="245" height="224" rx="10" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.5" filter="url(#roadShadow)"/>
    <rect x="0" y="0" width="245" height="34" rx="10" fill="url(#p3Grad)"/>
    <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#FFFFFF">PHASE 3: SERVICES</text>
    <rect x="172" y="7" width="60" height="20" rx="4" fill="#5B21B6"/>
    <text x="178" y="21" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#EDE9FE">ADVANCED</text>

    <!-- Project List -->
    <g transform="translate(14, 46)">
      <circle cx="8" cy="14" r="3" fill="#7C3AED"/>
      <text x="18" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#0F172A">07. GPTimer ISR &amp; Notify</text>
      <text x="18" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#64748B">Deferred processing &amp; task alerts</text>

      <circle cx="8" cy="62" r="3" fill="#7C3AED"/>
      <text x="18" y="66" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#0F172A">08. Software Timers</text>
      <text x="18" y="80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#64748B">One-shot &amp; periodic timer daemon</text>

      <circle cx="8" cy="110" r="3" fill="#7C3AED"/>
      <text x="18" y="114" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#0F172A">09. Runtime Monitoring</text>
      <text x="18" y="128" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#64748B">Stack watermarks &amp; heap auditing</text>

      <rect x="0" y="148" width="217" height="22" rx="4" fill="#FAF5FF"/>
      <text x="8" y="163" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#7C3AED">Core: xTimer, vTaskNotify</text>
    </g>
  </g>

  <!-- Phase 4 Card -->
  <g transform="translate(845, 28)">
    <rect x="0" y="0" width="245" height="224" rx="10" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1.5" filter="url(#roadShadow)"/>
    <rect x="0" y="0" width="245" height="34" rx="10" fill="url(#p4Grad)"/>
    <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#FFFFFF">PHASE 4: CAPSTONE</text>
    <rect x="174" y="7" width="58" height="20" rx="4" fill="#065F46"/>
    <text x="180" y="21" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#D1FAE5">EXPERT</text>

    <!-- Project List -->
    <g transform="translate(14, 46)">
      <circle cx="8" cy="14" r="3" fill="#059669"/>
      <text x="18" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#0F172A">10. Integrated Controller</text>
      <text x="18" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#64748B">Full 4-tier real-time control system</text>

      <circle cx="8" cy="62" r="3" fill="#059669"/>
      <text x="18" y="66" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#0F172A">Unified Subsystems</text>
      <text x="18" y="80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#64748B">Queues, Mutexes, Semaphores, ISR</text>

      <circle cx="8" cy="110" r="3" fill="#059669"/>
      <text x="18" y="114" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#0F172A">Production Resilience</text>
      <text x="18" y="128" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#64748B">Fault handling, telemetry, logging</text>

      <rect x="0" y="148" width="217" height="22" rx="4" fill="#ECFDF5"/>
      <text x="8" y="163" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#059669">Full FreeRTOS Core Suite</text>
    </g>
  </g>
</svg>
